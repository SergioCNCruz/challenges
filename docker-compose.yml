version: "3.8"
services:
  web:
    build: .
    depends_on:
      - db
      - selenium
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/postgres
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    ports:
      - "8000:8000"
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: '2gb'
